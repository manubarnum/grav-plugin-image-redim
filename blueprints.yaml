name: Image Redim
slug: image-redim
type: plugin
version: 2.1.0
description: Visual (WYSIWYG) image resizing in the Admin 2 Markdown editor (Grav 2).
icon: arrows-alt
author:
  name: Enkirche
homepage: https://www.enkirche.fr
docs: https://github.com/manubarnum/grav-plugin-image-redim/blob/main/README.md
bugs: https://github.com/manubarnum/grav-plugin-image-redim/issues
keywords: admin, image, resize, wysiwyg, editor
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: api, version: '>=1.0.0' }
  - { name: admin2, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_IMAGE_REDIM.ENABLED
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    mode:
      type: select
      label: PLUGIN_IMAGE_REDIM.MODE
      help: PLUGIN_IMAGE_REDIM.MODE_HELP
      default: resize
      options:
        resize: PLUGIN_IMAGE_REDIM.MODE_RESIZE
        cropResize: PLUGIN_IMAGE_REDIM.MODE_CROPRESIZE
        html: PLUGIN_IMAGE_REDIM.MODE_HTML

    lock_ratio:
      type: toggle
      label: PLUGIN_IMAGE_REDIM.LOCK_RATIO
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
